<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ṣaṭkāla Hexagram — Vaikhānasa Archana Times</title>
<meta name="description" content="Interactive six-pointed star visualization of the Vaikhānasa Ṣaṭkāla — six daily worship times computed from live solar position.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F0E4;
  --bg-card: #FFFBF4;
  --fg: #2A1A0E;
  --fg-muted: #6B5744;
  --accent: #C06818;
  --accent-soft: #E8C9A0;
  --gold: #B08830;
  --border: #E0D4C2;
  --sun-fill: #E8A020;
  --font-display: 'Cormorant Garamond', 'Georgia', serif;
  --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171210; --bg-card: #221C16; --fg: #E4D8C8; --fg-muted: #A09080;
    --accent: #E08838; --accent-soft: #4A3828; --gold: #C8A048;
    --border: #3A3028; --sun-fill: #E8A020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171210; --bg-card: #221C16; --fg: #E4D8C8; --fg-muted: #A09080;
  --accent: #E08838; --accent-soft: #4A3828; --gold: #C8A048;
  --border: #3A3028; --sun-fill: #E8A020;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  max-width: 420px;
  width: 100%;
}
.card svg { display: block; margin: 8px auto 0; }
.card-label {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.02em;
}
.card-detail {
  margin-top: 4px;
  font-style: italic;
  opacity: 0.7;
  font-size: 0.82rem;
}
.location-info {
  margin-top: 10px;
  font-size: 0.75rem;
  color: var(--fg-muted);
  opacity: 0.7;
}
.status-bar {
  margin-top: 16px;
  font-size: 0.75rem;
  color: var(--fg-muted);
  opacity: 0.6;
}
footer {
  margin-top: 20px;
  font-size: 0.7rem;
  color: var(--fg-muted);
  opacity: 0.5;
  text-align: center;
}
footer a { color: var(--accent); text-decoration: none; }
footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card" id="archanaCard">
  <div class="card-label">Ṣaṭkāla — Archana Times</div>
  <svg id="shatkalaSvg" viewBox="0 0 380 370" width="380" height="370" style="max-width:100%;height:auto"></svg>
  <div class="card-detail">Vaikhānasa Archana · Śrīnivāsa Parabrahma</div>
  <div class="location-info" id="locInfo">Requesting location…</div>
</div>

<div class="status-bar" id="statusBar"></div>

<footer>
  Ṣaṭkāla timings computed from live solar position<br>
  Based on <a href="https://en.wikipedia.org/wiki/Vaikhanasa" target="_blank" rel="noopener">Vaikhānasa</a> Āgamic tradition
</footer>

<script>
// ── Constants ──
const DEG = Math.PI / 180, RAD = 180 / Math.PI;

// ── Astronomical Functions ──
function mod360(x) { return ((x % 360) + 360) % 360; }

function julianDate(y, m, d, ut) {
  if (m <= 2) { y--; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + ut / 24 + B - 1524.5;
}

function sunLongitude(jd) {
  const T = (jd - 2451545.0) / 36525;
  const L0 = mod360(280.46646 + 36000.76983 * T + 0.0003032 * T * T);
  const M = mod360(357.52911 + 35999.05029 * T - 0.0001537 * T * T);
  const C = (1.914602 - 0.004817 * T) * Math.sin(M * DEG)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * M * DEG)
          + 0.000289 * Math.sin(3 * M * DEG);
  const omega = 125.04 - 1934.136 * T;
  return mod360(L0 + C - 0.00569 - 0.00478 * Math.sin(omega * DEG));
}

function computeSunriseSunset(year, month, day, lat, lon) {
  const jd = julianDate(year, month, day, 12);
  const Jstar = Math.round(jd - 2451545.0009 - lon / 360);
  const M = mod360(357.5291 + 0.98560028 * Jstar);
  const C = 1.9148*Math.sin(M*DEG) + 0.0200*Math.sin(2*M*DEG) + 0.0003*Math.sin(3*M*DEG);
  const lam = mod360(M + C + 180 + 102.9372);
  const dec = Math.asin(Math.sin(lam*DEG) * Math.sin(23.4393*DEG)) * RAD;
  const cosH = (Math.sin(-0.833*DEG) - Math.sin(lat*DEG)*Math.sin(dec*DEG)) / (Math.cos(lat*DEG)*Math.cos(dec*DEG));
  if (Math.abs(cosH) > 1) return null;
  const H = Math.acos(cosH) * RAD;
  const B = 360/365.242 * (julianDate(year, month, day, 0) - julianDate(year, 1, 1, 0) - 81);
  const EoT = 9.87*Math.sin(2*B*DEG) - 7.53*Math.cos(B*DEG) - 1.5*Math.sin(B*DEG);
  const solarNoonMin = 720 - 4*lon - EoT;
  return { sunrise: (solarNoonMin - 4*H) / 60, sunset: (solarNoonMin + 4*H) / 60, solarNoon: solarNoonMin / 60 };
}

// ── Time Formatting ──
function formatTimeLocal(localH) {
  let l = localH; while (l < 0) l += 24; while (l >= 24) l -= 24;
  const h = Math.floor(l), m = Math.floor((l - h) * 60);
  return `${h === 0 ? 12 : h > 12 ? h - 12 : h}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`;
}

// ── Ṣaṭkāla Archana Times ──
function getArchanaTimes(riseL, noonL, setL) {
  return [
    { name: 'Prātyuṣam',  te: 'ప్రాత్యుషం',  time: riseL - 1.6 },
    { name: 'Prātaḥkāla',  te: 'ప్రాతఃకాలం',  time: riseL },
    { name: 'Madhyāhna',  te: 'మధ్యాహ్నం',  time: noonL },
    { name: 'Aparāhṇa',   te: 'అపరాహ్ణం',   time: (noonL + setL) / 2 },
    { name: 'Sāyaṅkāla',  te: 'సాయంకాలం',  time: setL },
    { name: 'Niśi',        te: 'నిశి',        time: setL + 1.5 }
  ];
}

// ── Hexagram Renderer ──
function renderArchana(archanas, curHL) {
  const svg = document.getElementById('shatkalaSvg');
  if (!svg) return;
  const CX = 190, CY = 178, R = 125, D = Math.PI / 180;
  const rH = R / Math.sqrt(3); // inner hexagon circumradius
  const pt = (deg, r) => [CX + r * Math.sin(deg * D), CY - r * Math.cos(deg * D)];

  // 6 star points at 0°,60°,...,300° (CW from 12 o'clock)
  const sp = [0, 60, 120, 180, 240, 300].map(a => pt(a, R));
  // Inner hexagon vertices at 30°,90°,...,330°
  const hp = [30, 90, 150, 210, 270, 330].map(a => pt(a, rH));

  // Archana idx → angle on circumcircle / star-point idx
  // [0]Prātyuṣam→240°(#5), [1]Prātaḥkāla→300°(#6), [2]Madhyāhna→0°(#1),
  // [3]Aparāhṇa→60°(#2), [4]Sāyaṅkāla→120°(#3), [5]Niśi→180°(#4)
  const kA = [240, 300, 0, 60, 120, 180];
  const kS = [4, 5, 0, 1, 2, 3];

  // Determine current (ci) and next (ni) kāla
  let ci = -1;
  for (let i = archanas.length - 1; i >= 0; i--) {
    if (curHL >= archanas[i].time) { ci = i; break; }
  }
  const ni = ci + 1 < archanas.length ? ci + 1 : -1;

  let s = '';

  // ── Circumcircle (dashed) ──
  s += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--border)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>`;

  // ── Active arc highlight ──
  if (ci >= 0 && ni >= 0) {
    let a0 = kA[ci], a1 = kA[ni]; if (a1 <= a0) a1 += 360;
    const p0 = pt(a0, R), p1 = pt(a1 % 360, R);
    s += `<path d="M ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A ${R} ${R} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="2.5" opacity="0.3"/>`;
  } else if (ci < 0) {
    const p0 = pt(180, R), p1 = pt(240, R);
    s += `<path d="M ${p0[0].toFixed(1)} ${p0[1].toFixed(1)} A ${R} ${R} 0 0 1 ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.2"/>`;
  }

  // ── Interlocking triangles ──
  const tri = ps => ps.map(p => p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  s += `<polygon points="${tri([sp[0],sp[2],sp[4]])}" fill="none" stroke="var(--fg-muted)" stroke-width="1.2" opacity="0.4"/>`;
  s += `<polygon points="${tri([sp[1],sp[3],sp[5]])}" fill="none" stroke="var(--fg-muted)" stroke-width="1.2" opacity="0.4"/>`;

  // ── Active triangle highlight ──
  if (ci >= 0) {
    const si = kS[ci];
    s += `<polygon points="${tri([sp[si], hp[(si+5)%6], hp[si]])}" fill="var(--accent-soft)" opacity="0.25"/>`;
  }

  // ── Central hexagon ──
  s += `<polygon points="${tri(hp)}" fill="var(--bg-card)" stroke="var(--border)" stroke-width="0.8"/>`;

  // ── Thirunāmam (Ūrdhva Puṇḍra) ──
  const nT = CY - 20, nW = 10;
  // Left white mark (outline + fill)
  s += `<path d="M ${CX-nW} ${nT} Q ${CX-nW} ${CY+12} ${CX} ${CY+22}" fill="none" stroke="#D0C080" stroke-width="5" stroke-linecap="round"/>`;
  s += `<path d="M ${CX-nW} ${nT} Q ${CX-nW} ${CY+12} ${CX} ${CY+22}" fill="none" stroke="#F0E4C0" stroke-width="3.5" stroke-linecap="round"/>`;
  // Right white mark
  s += `<path d="M ${CX+nW} ${nT} Q ${CX+nW} ${CY+12} ${CX} ${CY+22}" fill="none" stroke="#D0C080" stroke-width="5" stroke-linecap="round"/>`;
  s += `<path d="M ${CX+nW} ${nT} Q ${CX+nW} ${CY+12} ${CX} ${CY+22}" fill="none" stroke="#F0E4C0" stroke-width="3.5" stroke-linecap="round"/>`;
  // Śrī Chūrṇam (red center line)
  s += `<line x1="${CX}" y1="${nT+3}" x2="${CX}" y2="${CY+14}" stroke="#CC3310" stroke-width="2.5" stroke-linecap="round"/>`;

  // ── Kāla position dots on circumcircle ──
  sp.forEach(p => {
    s += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.5" fill="var(--fg-muted)" opacity="0.3"/>`;
  });

  // ── Kāla labels in triangles ──
  const tR = R * 0.68;
  archanas.forEach((a, i) => {
    const [tx, ty] = pt(kA[i], tR);
    const isC = i === ci, isN = i === ni;
    const fc = isC ? 'var(--fg)' : isN ? 'var(--accent)' : 'var(--fg-muted)';
    const fw = isC || isN ? '600' : '400';
    const op = isC || isN ? 1 : 0.6;
    s += `<text x="${tx.toFixed(1)}" y="${(ty-7).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="${fw}" fill="${fc}" opacity="${op}">${a.name}</text>`;
    s += `<text x="${tx.toFixed(1)}" y="${(ty+5).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="${fc}" opacity="${(op*0.85).toFixed(2)}">${a.te}</text>`;
    s += `<text x="${tx.toFixed(1)}" y="${(ty+17).toFixed(1)}" text-anchor="middle" font-size="8" fill="var(--accent)" font-style="italic">${formatTimeLocal(a.time)}</text>`;
  });

  // ── Sun position & countdown ──
  let sunA, cdT = '';
  const nightLen = 24 - archanas[5].time + archanas[0].time;
  if (ci < 0) {
    // Before first kāla — interpolate night arc (Niśi→Prātyuṣam)
    const el = curHL + (24 - archanas[5].time);
    sunA = 180 + Math.min(1, el / nightLen) * 60;
    const m = Math.max(0, Math.floor((archanas[0].time - curHL) * 60));
    cdT = (m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + m%60 + 'm') + ' → ' + archanas[0].name;
  } else if (ni < 0) {
    // After last kāla — continue night arc interpolation
    const el = curHL - archanas[5].time;
    sunA = 180 + Math.min(1, el / nightLen) * 60;
    cdT = '✓ Concluded';
  } else {
    // Between kālas — interpolate on day arcs
    const frac = (curHL - archanas[ci].time) / (archanas[ni].time - archanas[ci].time);
    let a0 = kA[ci], a1 = kA[ni]; if (a1 <= a0) a1 += 360;
    sunA = (a0 + frac * (a1 - a0)) % 360;
    const m = Math.max(0, Math.floor((archanas[ni].time - curHL) * 60));
    cdT = (m < 60 ? m + 'm' : Math.floor(m/60) + 'h ' + m%60 + 'm') + ' → ' + archanas[ni].name;
  }

  // Sun: glow + body + rays
  const [sx, sy] = pt(sunA, R);
  s += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="16" fill="var(--sun-fill)" opacity="0.12"/>`;
  s += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="9" fill="var(--sun-fill)" opacity="0.9"/>`;
  for (let r = 0; r < 360; r += 45) {
    const rx = Math.cos(r*D), ry = Math.sin(r*D);
    s += `<line x1="${(sx+11*rx).toFixed(1)}" y1="${(sy+11*ry).toFixed(1)}" x2="${(sx+15*rx).toFixed(1)}" y2="${(sy+15*ry).toFixed(1)}" stroke="var(--sun-fill)" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>`;
  }

  // ── Countdown text on the active arc ──
  if (cdT) {
    let tAng;
    if (ci < 0) {
      tAng = ((sunA + 240) / 2) % 360;
    } else if (ni < 0) {
      tAng = (sunA + 10) % 360;
    } else {
      let a1 = kA[ni]; if (a1 <= sunA) a1 += 360;
      tAng = ((sunA + a1) / 2) % 360;
    }
    const [cx2, cy2] = pt(tAng, R + 20);
    const d = ((tAng % 360) + 360) % 360;
    const anc = (d > 50 && d < 130) ? 'start' : (d > 230 && d < 310) ? 'end' : 'middle';
    s += `<text x="${cx2.toFixed(1)}" y="${cy2.toFixed(1)}" text-anchor="${anc}" dominant-baseline="central" font-size="8.5" font-weight="600" fill="var(--accent)">${cdT}</text>`;
  }

  svg.innerHTML = s;
}

// ── Location & Update Loop ──
let geoLat = null, geoLon = null, tzOff = null;

function update() {
  if (geoLat === null) return;
  const now = new Date();
  tzOff = -now.getTimezoneOffset() / 60;
  const utcH = now.getUTCHours() + now.getUTCMinutes() / 60 + now.getUTCSeconds() / 3600;
  const curHL = utcH + tzOff;

  const sun = computeSunriseSunset(now.getFullYear(), now.getMonth() + 1, now.getDate(), geoLat, geoLon);
  if (!sun) { document.getElementById('statusBar').textContent = 'Cannot compute sun for this latitude'; return; }

  const riseL = sun.sunrise + tzOff;
  const noonL = sun.solarNoon + tzOff;
  const setL  = sun.sunset + tzOff;

  const archanas = getArchanaTimes(riseL, noonL, setL);
  renderArchana(archanas, curHL);

  const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('statusBar').textContent = `Updated ${timeStr}`;
}

function requestLocation() {
  if (!navigator.geolocation) {
    document.getElementById('locInfo').textContent = 'Geolocation not supported — using Tirupati';
    geoLat = 13.6288; geoLon = 79.4192;
    update();
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      geoLat = pos.coords.latitude;
      geoLon = pos.coords.longitude;
      document.getElementById('locInfo').textContent =
        `${geoLat.toFixed(2)}°N, ${geoLon.toFixed(2)}°E · UTC${(-new Date().getTimezoneOffset()/60) >= 0 ? '+' : ''}${(-new Date().getTimezoneOffset()/60).toFixed(1)}`;
      update();
    },
    () => {
      document.getElementById('locInfo').textContent = 'Location denied — using Tirupati (Śrī Veṅkaṭeśvara)';
      geoLat = 13.6288; geoLon = 79.4192;
      update();
    },
    { enableHighAccuracy: false, timeout: 8000 }
  );
}

requestLocation();
setInterval(update, 60000); // refresh every minute
</script>
</body>
</html>
